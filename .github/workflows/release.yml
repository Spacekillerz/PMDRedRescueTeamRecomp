name: Release

# A v* tag publishes a GitHub release; a manual run only uploads the bundles as
# workflow artifacts, to test packaging without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # flatpak-builder needs to create its own namespaces.
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply gbarecomp patches
        run: |
          git config --global --add safe.directory '*'
          scripts/apply_patches.sh

      - name: Build the bundle
        env:
          FLATPAK_SCOPE: --system
          FLATPAK_BUILDER_EXTRA: --disable-rofiles-fuse
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          scripts/package_flatpak.sh

      - name: Name
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          cp flatpak-build/PMDRedRescueTeamRecomp.flatpak "dist/PMDRedRescueTeamRecomp-linux-x86_64-${version}.flatpak"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/

  windows:
    name: Windows zip
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply gbarecomp patches
        run: scripts/apply_patches.sh

      - name: Build the zip
        run: scripts/package_windows.sh

      - name: Name
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          cp windows-build/PMDRedRescueTeamRecomp-windows-x64.zip "dist/PMDRedRescueTeamRecomp-windows-x64-${version}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  publish:
    name: Publish
    needs: [flatpak, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.flatpak *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/*.flatpak
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: packaging/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
