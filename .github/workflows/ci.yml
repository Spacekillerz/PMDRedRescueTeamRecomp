name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  builder:
    name: Builder (no ROM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Flatpak's own SDK: it brings the compiler, CMake, Ninja and SDL2, so
    # nothing comes from the Ubuntu mirrors, and the builder is checked against
    # the toolchain players' builds use.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply gbarecomp patches
        run: |
          git config --global --add safe.directory '*'
          scripts/apply_patches.sh

      # BUILDER_ONLY is the property releases depend on: everything published
      # configures and links without any ROM present.
      - name: Configure (builder only)
        run: cmake -S . -B build-builder -G Ninja -DCMAKE_BUILD_TYPE=Release -DGBAGAME_BUILDER_ONLY=ON

      - name: Build
        run: cmake --build build-builder --target PMDRedRescueTeamBuilder test_builder_core gba_recompile

      - name: Unit tests
        run: build-builder/test_builder_core

      - name: Generate the Flatpak manifest
        run: scripts/package_flatpak.sh --generate-only

  windows:
    name: Windows builder (shipped toolchain, no ROM)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply gbarecomp patches
        run: scripts/apply_patches.sh

      # Builds with the w64devkit + SDL2 the zip ships, runs the unit tests and
      # assembles the zip: the same path the release takes.
      - name: Build and package
        run: scripts/package_windows.sh
