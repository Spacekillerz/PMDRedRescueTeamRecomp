# Seed copied next to the executable on the first configure; the launcher
# edits the copy in build/, not this file.
#
# [KeyMap] values are SDL key names (layout-aware: the printed letter on an
# AZERTY keyboard), optionally prefixed with Ctrl+ / Alt+ / Shift+.
# Controller: L3 = pause, R3 = fullscreen.

[KeyMap]
Fullscreen=F11
Pause=P
Turbo=Tab
VolumeUp=PageUp
VolumeDown=PageDown
WindowBigger=Ctrl+PageUp
WindowSmaller=Ctrl+PageDown
DisplayPerf=F
