# --- Code copied from ROM into RAM at runtime --------------------------------

# InitIntrTable (src/reg_control.c) copies IntrMain (src/crt0.s, 0x120 bytes)
# into IntrMain_Buffer and points INTR_VECTOR at the copy.
[[code_copy]]
runtime_start = 0x0202D4B8
source_start = 0x08000104
size = 0x120
name = "IntrMain"

[[extra_func]]
addr = 0x0202D4B8
mode = "arm"
name = "IntrMain"
note = "IRQ entry, reached through INTR_VECTOR"

# IntrMain calls the C handler with lr = IntrMain_RetAddr (+0xAC), so the
# handler's return lands inside IntrMain.
[[extra_func]]
addr = 0x0202D564
mode = "arm"
resume = true
name = "IntrMain_RetAddr"
note = "return point inside IntrMain"

# m4aSoundInit (src/m4a.c) copies SoundMainRAM (src/m4a_1.s, 0x400 bytes) into
# SoundMainRAM_Buffer, the first IWRAM variable. SoundMain enters it through
# the literal lt_SoundMainRAM_Buffer (0x03000001) at 0x080AE2E8.
[[code_copy]]
runtime_start = 0x03000000
source_start = 0x080AE2F8
size = 0x400
name = "SoundMainRAM"

[[extra_func]]
addr = 0x03000000
mode = "thumb"
name = "SoundMainRAM"
note = "m4a PCM mixer, called every frame"

# --- Widescreen --------------------------------------------------------------

# AddAxSprite (src/sprite.c) drops every Pokemon sprite part at x >= 240;
# src/dungeon_widescreen.cpp takes over the calls that land in the right margin.
[[mod_function_hook]]
addr = 0x08004EA8
mode = "thumb"
note = "AddAxSprite: dungeon widescreen margin sprites"

# DrawStatusSprite (src/dungeon_pokemon_sprites.c) drops status icons at x >= 240.
[[mod_function_hook]]
addr = 0x0800F364
mode = "thumb"
note = "DrawStatusSprite: dungeon widescreen margin status icons"

# Wild Pokemon and floor items only show within 6 tiles of the leader; the
# draw calls see 7 so they slide out of the margins instead of vanishing.
[[mod_function_hook]]
addr = 0x08042768
mode = "thumb"
note = "sub_8042768, from the Pokemon renderer only: 7-tile range"

[[mod_function_hook]]
addr = 0x08045888
mode = "thumb"
note = "ShouldDisplayEntity, from the floor item renderer only: 7-tile range"

# The floor item renderer drops icons left of x = -32, inside the left margin.
[[mod_function_hook]]
addr = 0x080462AC
mode = "thumb"
note = "sub_80462AC: floor item icons in the left margin"
